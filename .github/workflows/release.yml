# Builds StreamQuality.zip (just what's needed to install) and publishes a GitHub release
# every time a version tag like v1.3.0 is pushed.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Files at the top of the ZIP, so Windows' "Extract All" gives a single StreamQuality folder
      - name: Build StreamQuality.zip
        run: zip StreamQuality.zip Install.bat install.ps1 index.ts native.ts LICENSE

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ p = (index($0, "## " v " ") == 1 || $0 == "## " v); next } p' CHANGELOG.md > notes.md
          printf '\n**How to install:** download StreamQuality.zip below, extract it and double-click Install.bat. Full guide: https://github.com/%s#installation\n' "$GITHUB_REPOSITORY" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" StreamQuality.zip --title "StreamQuality ${GITHUB_REF_NAME#v}" --notes-file notes.md